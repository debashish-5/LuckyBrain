[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "luckybrain"
version = "0.1.0"
description = "Composable Python foundations for RAG and agent systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["rag", "retrieval-augmented-generation", "agents", "llm"]
dependencies = [
    "openai>=1.0.0",
    "groq>=0.12.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "numpy>=1.24",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
embeddings = [
    "numpy>=1.24",
    "sentence-transformers>=3.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.27,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/luckybrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
